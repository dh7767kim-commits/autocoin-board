async function open_(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
 const m=html.match(/<title>([^<]*)<\/title>/);if(m)document.title=m[1];
 const add=()=>{const b=document.createElement('button');b.textContent='🔒 잠그기';b.title='이 기기에 기억된 열쇠를 지우고 다시 잠급니다';

async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.s),iterations:P.n},base,256))}

 const remember=document.getElementById('rm').checked;
 try{const raw=await derive(document.getElementById('pw').value);
